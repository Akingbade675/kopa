<style>
/* Layout: one centred phone-width column, floating dark pill nav with a raised active circle. */
:root {
  --bg: #f5f7f6;
  --card: #ffffff;
  --fg: #000000;
  --muted: #575958;
  --border: #eceeed;
  --divider: #f1f1f1;
  --track: #f1f2f2;
  --primary: #0d6c3f;
  --primary-press: #0a5a34;
  --primary-fg: #ffffff;
  --code: #246e3b;
  --soft: #e6f2eb;
  --soft-fg: #0d6c3f;
  --warn: #c4561a;
  --warn-soft: #fff3e3;
  --danger: #d92d2d;
  --danger-soft: #fdeaea;
  --ok-dot: #2f9461;
  --nav: #0c2417;
  --nav-fg: #b6ccc0;
  --nav-active: #9ac7b2;
  --nav-grad-a: #2b7c56;
  --nav-grad-b: #1c573c;
  --ring: #e0e8e4;
  --pill-bg: #fcf8ec;
  --pill-border: #ebd88c;
  --pill-fg: #542e17;
  --pill-icon: #b84c00;
  --shadow: 0 1px 2px rgb(0 0 0 / .03), 0 4px 16px rgb(0 0 0 / .04);
  --font: "DM Sans", Inter, -apple-system, "SF Pro Text", system-ui, sans-serif;
  --title-font: Inter, "SF Pro Display", -apple-system, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }

.page { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 37.3px) 15.3px 170px; display: flex; flex-direction: column; gap: 0; }

/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 0 2.7px; }
.head .hello { color: var(--muted); font-size: 13.1px; font-weight: 400; line-height: 18px; }
.editable { cursor: pointer; }
.head h1 { font-size: 27.1px; font-weight: 700; letter-spacing: -.3px; line-height: 34px; margin-top: 1.4px; }
.head .code { font-size: 11px; font-weight: 600; color: var(--code); margin-top: 1.5px; line-height: 16px; }
.head-right { display: flex; align-items: center; gap: 7.3px; flex: none; margin-top: -5.3px; margin-right: -1.3px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #c8c8c8; background: var(--card); color: #2e2e2e; display: grid; place-items: center; flex: none; box-shadow: 0 2px 6px rgb(0 0 0 / .08); padding: 0; }
.icon-btn svg { width: 21.5px; height: 21.5px; }
.icon-btn.sm { width: 36px; height: 36px; box-shadow: none; }
.icon-btn.sm svg { width: 17px; height: 17px; }
.icon-btn.spin svg { animation: spin .6s ease-in-out; }
@keyframes spin { to { transform: rotate(360deg); } }
.date-pill { display: inline-flex; align-items: center; justify-content: center; gap: 5.3px; width: 106px; height: 26px; padding: 0 2px 0 0; background: var(--pill-bg); border: 1.2px solid var(--pill-border); border-radius: 999px; color: var(--pill-fg); font-size: 10.8px; font-weight: 600; white-space: nowrap; }
.date-pill svg { width: 13.3px; height: 13.6px; color: var(--pill-icon); flex: none; }

/* Segmented control */
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 42px; padding: 4px; margin: 0 3.4px; margin-top: 17.7px; background: var(--track); border: 1px solid var(--border); border-radius: 999px; }
.seg-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--card); border-radius: 999px; box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: transform .25s cubic-bezier(.3, 1.2, .5, 1); }
.seg[data-active="updates"] .seg-thumb { transform: translateX(100%); }
.seg button { position: relative; z-index: 1; border: 0; background: none; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding-top: 4.6px; transition: color .2s; }
.seg button[aria-selected="true"] { color: var(--fg); }
.seg-count { color: #b42b3a; font-weight: 700; margin-left: 1px; font-variant-numeric: tabular-nums; }
.seg-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; font-style: normal; display: grid; place-items: center; }

/* Sections */
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
.sec-head h2, .sec-title { font-size: 17.45px; font-weight: 700; letter-spacing: -.2px; line-height: 24px; }
.sec-title { margin-bottom: 12px; margin-left: -1px; }

#view { display: flex; flex-direction: column; gap: 24px; margin-top: 19.3px; }
#view.inner { display: block; margin: -2px -1px 0; }
#view.inner .screen-title, #view.inner .screen-sub, #view.inner .pnote { margin-left: 0; }
.unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #b42b3a; margin: 0 7px 1px 0; vertical-align: middle; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.empty-flat { min-height: 60px; display: grid; place-items: center; padding: 19.3px 16px 16.7px; background: var(--bg); border: 1px solid var(--border); border-radius: 22px; color: var(--muted); font-size: 10.95px; text-align: center; }
.empty-flat small { display: block; font-size: 13px; margin-top: 4px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--soft); color: var(--soft-fg); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.plain { background: var(--bg); color: var(--muted); }

.btn { border: 1px solid var(--border); background: var(--card); border-radius: 14px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.block { width: 100%; padding: 14px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

/* Event card */
.ev { padding: 17.3px 13.3px 21.3px; border-radius: 26px; }
.ev-title { font-family: var(--title-font); font-size: 17px; font-weight: 700; letter-spacing: -.3px; line-height: 20px; text-transform: uppercase; }
.ev-meta { display: grid; gap: 4px; margin-top: 3.7px; font-size: 10.9px; line-height: 16px; color: var(--muted); }
.ev-meta > p:first-child { font-family: var(--title-font); font-weight: 400; font-size: 10.55px; }
.ev-loc { display: flex; align-items: center; gap: 6.7px; }
.ev-loc .pin { font-size: 11px; width: 13px; line-height: 16px; flex: none; text-align: center; }
.ev-rule { border: 0; border-top: 1px solid var(--divider); margin: 14px 0 0; }

.checkin-wrap { margin-top: 22px; display: grid; justify-items: center; gap: 14px; }
.checkin-btn { width: 198.7px; height: 98.7px; border: 0; border-radius: 34px; background: var(--primary); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; font-size: 12.7px; font-weight: 700; letter-spacing: .5px; box-shadow: 0 8px 18px rgb(13 108 63 / .22); transition: transform .12s, background .12s; }
.checkin-btn svg { width: 37.3px; height: 37.3px; }
.checkin-btn:active { transform: scale(.97); background: var(--primary-press); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

.steps { display: grid; gap: 12px; margin-top: 20px; }
.step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }

  function drawCode(c, text) {
    const n = 57, x = c.getContext("2d"); c.width = c.height = n + 2;
    const ink = "#0b2318";
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
    x.fillStyle = "#fff"; x.fillRect(0, 0, n + 2, n + 2); x.translate(1, 1); x.fillStyle = ink;
    for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) if (r() > .5) x.fillRect(i, y, 1, 1);
    const sq = (a, b, s) => { x.fillStyle = "#fff"; x.fillRect(a - 1, b - 1, s + 2, s + 2); x.fillStyle = ink; x.fillRect(a, b, s, s); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, s - 2, s - 2); x.fillStyle = ink; x.fillRect(a + 2, b + 2, s - 4, s - 4); };
    sq(0, 0, 7); sq(n - 7, 0, 7); sq(0, n - 7, 7);
    const al = (a, b) => { x.fillStyle = ink; x.fillRect(a, b, 5, 5); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, 3, 3); x.fillStyle = ink; x.fillRect(a + 2, b + 2, 1, 1); };
    const P = [6, 28, 50]; P.forEach(a => P.forEach(b => { if (!((a === 6 && b === 6) || (a === 50 && b === 6) || (a === 6 && b === 50))) al(a - 2, b - 2); }));
    for (let i = 8; i < n - 8; i++) { x.fillStyle = i % 2 ? "#fff" : ink; x.fillRect(i, 6, 1, 1); x.fillRect(6, i, 1, 1); }
  }

  /* ---------- Bottom bar with curved cut-out ---------- */
  let navX = null, navRaf = 0;
  const RN = 32.3, F = 6.5;
  function navPathD(w, h, cx) {
    const R = h / 2, d = Math.sqrt((RN + F) ** 2 - F ** 2), k = RN / (RN + F);
    const lx = Math.max(cx - d, R * .6), rx = Math.min(cx + d, w - R * .6);
    const tl = [cx - d * k, F * k], tr = [cx + d * k, F * k];
    return `M${R},0 L${lx},0 A${F},${F} 0 0 1 ${tl[0]},${tl[1]} A${RN},${RN} 0 0 0 ${tr[0]},${tr[1]} A${F},${F} 0 0 1 ${rx},0 L${w - R},0 A${R},${R} 0 0 1 ${w - R},${h} L${R},${h} A${R},${R} 0 0 1 ${R},0 Z`;
  }
  function setNav(x) {
    const nav = $("#nav"), w = nav.clientWidth, h = nav.clientHeight;
    navX = x;
    $("#navPath").setAttribute("d", navPathD(w, h, x));
    $(".nav-ind").style.left = x + "px";
    $(".nav-halo").style.left = x + "px";
  }
  function placeNav(i, animate) {
    const nav = $("#nav"), w = nav.clientWidth;
    const tx = 34 + (w - 68) / 4 * (i + .5);
    cancelAnimationFrame(navRaf);
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (navX === null || !animate || still || Math.abs(tx - navX) < .5) return setNav(tx);
    const from = navX, t0 = performance.now(), dur = 380;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      setNav(from + (tx - from) * e);
      if (k < 1) navRaf = requestAnimationFrame(step);
    };
    navRaf = requestAnimationFrame(step);
  }
  addEventListener("resize", () => placeNav(TABS.indexOf(NAV_OF[S.tab] || S.tab), false));

  function checkin() {
    S.stage = "checking"; render();
    [0, 1, 2].forEach(i => {
      setTimeout(() => $(`.step[data-s="${i}"]`)?.classList.add("run"), i * 750);
      setTimeout(() => { const el = $(`.step[data-s="${i}"]`); el?.classList.remove("run"); el?.classList.add("done"); }, i * 750 + 700);
    });

  }

  /* ---------- Events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("button, .scrim, [data-act=\"edit\"]");
    if (!t) return;
    if (t.classList.contains("scrim") && e.target !== t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); scrollTo({ top: 0 }); return; }
    if (t.dataset.sub) { const [k, j] = t.dataset.sub.split(":"); S.prevSub = { key: k, from: S.sub[k] }; S.sub[k] = +j; render(); return; }
    if (t.dataset.read) { const n = S.news[+t.dataset.read]; if (!n.read) { n.read = true; render(); } toast(n.title, n.text); return; }
    if (t.dataset.seg) { S.seg = t.dataset.seg; if (S.seg === "updates") S.seenAlerts = true; render(); return; }
    if (t.dataset.up) { const a = S.alerts[+t.dataset.up]; a.mine = !a.mine; t.setAttribute("aria-pressed", a.mine); t.textContent = `▲ ${a.up + (a.mine ? 1 : 0)} affected`; return; }
    const act = t.dataset.act;
    if (act === "close") return closeSheet();
    if (act === "edit") return editSheet();
    if (act === "resetDetails") { Object.assign(D, DEFAULTS); saveD(); closeSheet(); render(); toast("Details reset", "Back to the original text."); return; }
    if (act === "checkin") { if (navigator.vibrate) navigator.vibrate(10); return checkin(); }
    if (act === "excuse") return excuseSheet();
    if (act === "soon") return toast("Not in this preview", "This screen works in the full app.");
    if (act === "refresh") { t.classList.remove("spin"); void t.offsetWidth; t.classList.add("spin"); toast("Up to date", "Events refreshed just now."); return; }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if ((e.key === "Enter" || e.key === " ") && e.target.id === "hName") { e.preventDefault(); editSheet(); } });
  document.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "editForm") {
      const v = id => $("#" + id).value.trim();
      Object.assign(D, { surname: v("dSurname"), email: v("dEmail") || DEFAULTS.email, phone: v("dPhone") || DEFAULTS.phone, group: v("dGroup") || DEFAULTS.group, name: v("dName") || DEFAULTS.name, code: v("dCode") || DEFAULTS.code, num: v("dNum").replace(/^#/, "") || DEFAULTS.num, checkinAt: v("dTime") || DEFAULTS.checkinAt, event: v("dEvent") || DEFAULTS.event, time: v("dHours") || DEFAULTS.time, address: v("dAddr") || DEFAULTS.address, status: v("dStatus") || DEFAULTS.status });
      saveD(); closeSheet(); render(); toast("Saved", "Your details are updated."); return;
    }
    if (e.target.id !== "exForm") return;
    const txt = $("#exText").value.trim();
    if (txt.length < 10) { const er = $("#exErr"); er.textContent = "Add a short explanation (at least 10 characters) so your Exco can review it."; er.hidden = false; return; }
    closeSheet(); toast("Report sent", "Your Exco will review it. You'll get a notification with the decision.");
  });
  document.addEventListener("change", e => {
    if (e.target.id === "setPush") { S.push = e.target.checked; toast(S.push ? "Notifications on" : "Notifications off", S.push ? "We'll alert you when your range is called." : "You'll need to watch the screen for your number."); }
  });

  $("#dateText").textContent = TODAY_LONG;
  $("#datePill").setAttribute("aria-label", "Today's date, " + NOW.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }));
  const h = NOW.getHours();
  $("#greet").textContent = h < 12 ? "Good morning!" : h < 17 ? "Good afternoon!" : "Good evening!";
  render();
})();
</script>
</body>
</html>
